<!DOCTYPE html>
<html lang="en-GB" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solutions Way | Digital Marketing, SEO, Mobile Apps &amp; Software Development</title>
    <meta
      name="description"
      content="Solutions Way is a London digital services consultancy providing digital marketing, technical SEO, mobile applications, and bespoke software development."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph / Social Meta -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Solutions Way | Digital Services London" />
    <meta
      property="og:description"
      content="Digital Marketing, Technical SEO, Mobile App Development, and Bespoke Software Engineering in London."
    />
    <meta property="og:site_name" content="Solutions Way" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Solutions Way | Digital Services London" />
    <meta
      name="twitter:description"
      content="Digital Marketing, Technical SEO, Mobile App Development, and Bespoke Software Engineering in London."
    />

    <!-- Google Structured Data: ProfessionalService -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Solutions Way",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "103, Dawes Road",
          "addressLocality": "London",
          "postalCode": "SW67DU",
          "addressCountry": "GB"
        },
        "url": "https://solutionsway.co.uk",
        "priceRange": "££",
        "makesOffer": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Digital Marketing" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "SEO" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Mobile App Development" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Software Development" } }
        ]
      }
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-blue-600 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
